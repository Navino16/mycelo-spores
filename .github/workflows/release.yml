name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    # Releases are tagged `<spore>@<semver>`. Anything else in this repository is not a
    # spore release and must not attach an asset.
    if: contains(github.event.release.tag_name, '@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # The release is already published by the time this workflow runs, so a mis-cut tag must
      # fail here, in seconds, rather than after the ~25s `bun run ci` below.
      - name: Resolve the spore from the tag
        id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="${TAG%@*}"
          strain="${TAG##*@}"
          dir="$(bun tools/locate.ts "$name")"
          actual="$(bun -e "console.log(JSON.parse(await Bun.file('$dir/package.json').text()).version)")"
          if [ "$actual" != "$strain" ]; then
            echo "::error::tag says $strain, $name declares $actual"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "asset=$name-$strain.tgz" >> "$GITHUB_OUTPUT"

      - run: bun run ci

      - name: Build the bundle
        env:
          DIR: ${{ steps.target.outputs.dir }}
        run: bun run bundle -- "$DIR" dist

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ steps.target.outputs.asset }}
        run: gh release upload "$TAG" "dist/$ASSET" --clobber
